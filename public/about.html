<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>درباره‌ی ما | Chess League</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <div><h1>ℹ️ درباره‌ی ما</h1><p>سازنده‌ی Chess League</p></div>
      </div>
      <button class="theme-toggle" id="themeToggleBtn">🌙</button>
    </div>

    <div class="card" style="text-align:center; padding:34px 20px">
      <div style="width:84px; height:84px; border-radius:50%; margin:0 auto 16px;
        background:linear-gradient(135deg,var(--blue),var(--purple));
        display:flex; align-items:center; justify-content:center; font-size:38px;">♞</div>
      <h2 style="justify-content:center; font-size:20px; margin-bottom:6px">یونس عبدی</h2>
      <p style="color:var(--text2); font-size:13.5px; max-width:460px; margin:0 auto; line-height:2;">
        این سایت رو از صفر، قدم‌به‌قدم، خودم طراحی و برنامه‌نویسی کردم — از صفحه‌ی شطرنج و بازی آنلاین زنده گرفته تا
        لیگ و جدول امتیازات. هدفم این بود که یه فضای ساده و خودمونی برای بازی شطرنج با دوستام بسازم. امیدوارم
        بهتون خوش بگذره!
      </p>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/nav-common.js"></script>
</body>
</html>
