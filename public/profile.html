<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروفایل | Chess League</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <div><h1>👤 پروفایل</h1><p>اطلاعات و آواتار تو</p></div>
      </div>
      <button class="theme-toggle" id="themeToggleBtn">🌙</button>
    </div>

    <div class="card">
      <div class="profile-hero">
        <div id="profileAvatarBox"></div>
        <div class="info">
          <div class="nm" id="profileNameText">—</div>
          <span class="ttl" id="profileTitle">🌱 مبتدی</span>
          <div style="margin-top:10px; font-size:12px; color:var(--text2)">۵ نتیجه‌ی آخر: <span id="pForm">—</span></div>
        </div>
        <div class="ring" id="winRing"><span id="pRate">0٪<small>درصد برد</small></span></div>
      </div>
      <div class="mini-stats">
        <div><b id="pGames">-</b><span>بازی</span></div>
        <div><b id="pWon" class="pts-pos">-</b><span>برد</span></div>
        <div><b id="pLost" class="pts-neg">-</b><span>باخت</span></div>
        <div><b id="pPoints">-</b><span>امتیاز (برد +۱، باخت −۱)</span></div>
      </div>
      <div class="mini-stats" style="grid-template-columns:repeat(2,1fr)">
        <div><b id="pDraw">-</b><span>مساوی</span></div>
        <div><b id="pRank">-</b><span>رتبه‌ی فعلی</span></div>
      </div>
    </div>

    <div class="card">
      <h2>انتخاب آواتار</h2>
      <p class="page-intro">یکی از ۲۰ آواتار رو انتخاب کن — تو جدول امتیازات و همه‌جا همین دیده می‌شه.</p>
      <div id="avatarPicker" class="avatar-grid"></div>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/nav-common.js"></script>
  <script src="js/avatars.js"></script>
  <script>
    const PLAYER_KEY = "cl-player-name";
    const myName = CLPrefs.get(PLAYER_KEY, "");
    document.getElementById("profileNameText").textContent = myName || "مهمان";

    function renderAvatarBox(index) {
      document.getElementById("profileAvatarBox").innerHTML = avatarHTML(index, "profile-avatar");
    }

    function renderPicker(selectedIndex) {
      const box = document.getElementById("avatarPicker");
      box.innerHTML = AVATAR_PRESETS.map((a, i) =>
        `<button data-i="${i}" type="button" class="${i === selectedIndex ? "sel" : ""}" aria-label="آواتار ${i + 1}">${avatarHTML(i)}</button>`
      ).join("");
      box.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const i = parseInt(btn.dataset.i);
          setSavedAvatar(i);
          renderAvatarBox(i);
          renderPicker(i);
          if (myName) {
            try {
              await fetch("/api/players", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: myName, avatar: i }),
              });
            } catch (err) {}
          }
        });
      });
    }

    async function loadStats() {
      renderAvatarBox(getSavedAvatar());
      renderPicker(getSavedAvatar());
      if (!myName) return;
      try {
        const res = await fetch(`/api/dashboard?name=${encodeURIComponent(myName)}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById("pGames").textContent = data.stats.gamesPlayed;
        document.getElementById("pPoints").innerHTML = fmtPoints(data.stats.points);
        document.getElementById("pRank").textContent = data.stats.rank;
        const me = data.leagueTable.find((p) => p.isMe);
        document.getElementById("pWon").textContent = me ? me.won : 0;
        document.getElementById("pLost").textContent = me ? me.lost : 0;
        document.getElementById("pDraw").textContent = me ? me.draw : 0;
        document.getElementById("pForm").innerHTML = me && me.form.length ? formDots(me.form) : "—";
        const rate = me ? me.winRate || 0 : 0;
        document.getElementById("winRing").style.setProperty("--p", rate);
        document.getElementById("pRate").innerHTML = rate + '٪<small>درصد برد</small>';
        document.getElementById("profileTitle").textContent = rankTitle(data.stats.points);
        if (data.avatar !== undefined && data.avatar !== null) {
          setSavedAvatar(data.avatar);
          renderAvatarBox(data.avatar);
          renderPicker(data.avatar);
        }
      } catch (err) {
        // دیتابیس وصل نیست؛ فقط آواتار محلی رو نشون می‌دیم
      }
    }
    loadStats();
  </script>
</body>
</html>
