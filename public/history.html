<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تاریخچه بازی‌ها | Chess League</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="ic">♞</div>Chess League</div>
    <nav class="nav">
      <a href="index.html">🏠 خانه</a>
      <a href="game.html">♟️ بازی (محلی / با بات)</a>
      <a href="online.html">🌐 بازی آنلاین (زنده)</a>
      <a href="league.html">🏆 لیگ ۴ نفره</a>
      <a href="leaderboard.html">📊 جدول امتیازات</a>
      <a href="history.html" class="active">📜 تاریخچه بازی‌ها</a>
      <a href="profile.html">👤 پروفایل</a>
      <a href="settings.html">⚙️ تنظیمات</a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <div><h1>📜 تاریخچه بازی‌ها</h1><p>همه‌ی بازی‌های انجام‌شده‌ی لیگ</p></div>
      </div>
      <button class="theme-toggle" id="themeToggleBtn">🌙</button>
    </div>

    <div class="card">
      <h2>بازی‌های اخیر</h2>
      <div id="historyGames">در حال بارگذاری...</div>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/nav-common.js"></script>
  <script>
    async function load() {
      const box = document.getElementById("historyGames");
      try {
        const res = await fetch("/api/history?limit=30");
        if (!res.ok) throw new Error();
        const games = await res.json();
        box.innerHTML = games.length
          ? games.map(g => {
              const resultText = g.result === "draw" ? "مساوی" : g.result === "white" ? `برد ${g.white_name}` : `برد ${g.black_name}`;
              const type = g.result === "draw" ? "draw" : "win";
              return `
              <div class="game-row">
                <span>${g.white_name} vs ${g.black_name}</span>
                <span class="result ${type}">${resultText}</span>
              </div>`;
            }).join("")
          : `<div style="color:var(--text2); font-size:13px">هنوز بازی‌ای ثبت نشده</div>`;
      } catch (err) {
        box.innerHTML = `<div style="color:var(--text2); font-size:13px">دیتابیس هنوز وصل نیست</div>`;
      }
    }
    load();
  </script>
</body>
</html>
